<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} — David Kwon</title>
<meta name="description" content="{{OG_DESCRIPTION}}">
<meta name="keywords" content="{{KEYWORDS_CSV}}">
<meta name="author" content="David Kwon">

<!-- Open Graph -->
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{OG_DESCRIPTION}}">
<meta property="og:type" content="article">
<meta property="og:url" content="https://davidkwon1113.github.io/posts/{{SLUG}}.html">
<meta property="og:site_name" content="David Kwon">
<!-- {{OG_IMAGE_META}} -->

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{TITLE}}">
<meta name="twitter:description" content="{{OG_DESCRIPTION}}">

<link rel="canonical" href="https://davidkwon1113.github.io/posts/{{SLUG}}.html">
<link rel="stylesheet" href="../style.css">
</head>
<body>

<nav class="nav">
  <a class="nav-brand" href="../" style="display:flex;align-items:center;gap:10px;">
    <img src="../assets/logo.jpg" alt="ahang-ahang" style="width:32px;height:32px;border-radius:50%;">
    ahang-ahang
  </a>
  <ul class="nav-links">
    <li><a href="../">Blog</a></li>
    <li><a href="../portfolio.html">Portfolio</a></li>
  </ul>
</nav>

<article class="page">
  <header class="post-header">
    <p class="post-date">{{DATE}}<!-- {{UPDATED}} --></p>
    <h1 class="post-title">{{TITLE}}</h1>
    <p class="post-summary">{{SUMMARY}}</p>
  </header>

  <div class="format-tabs">
    <button class="format-tab active" data-tab="human">Human<span class="tab-badge">.html</span></button>
    <button class="format-tab" data-tab="agent">Agent<span class="tab-badge">.md</span></button>
  </div>

  <div id="panel-human" class="format-panel active">
  <div class="post-body">
    {{BODY}}
  </div>
  </div>

  <div id="panel-agent" class="format-panel">
    <div class="md-view">
      <span class="md-view-loading" id="md-content">Loading .md content...</span>
    </div>
  </div>

  <div class="social-section">
    <div class="share-row">
      <button class="share-btn" onclick="shareTwitter()">Share on X</button>
      <button class="share-btn" onclick="shareLinkedIn()">Share on LinkedIn</button>
      <button class="share-btn" onclick="copyLink()">Copy link</button>
    </div>
    <div class="comments-section" id="giscus-container">
      <!-- Giscus loads here -->
    </div>
  </div>
</article>

<footer class="footer">
  David Kwon · LINE Pay Thailand
</footer>

<script src="../blog.js"></script>
<script>
  initShare('{{TITLE}}', window.location.href);
  initGiscus('giscus-container');
  initFormatTabs('{{SLUG}}');
</script>
</body>
</html>
